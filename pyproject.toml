[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-finder"
version = "0.1.0"
description = "A 1D CNN baseline for classifying Kepler light curves"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "streamlit>=1.40,<2",
    "tensorflow>=2.16,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
exoplanet-train = "exoplanet_finder.train:main"
exoplanet-predict = "exoplanet_finder.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
